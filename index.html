<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>レンジ800W変換</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #111111;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 480px);
      margin: 0 auto;
      padding: 20px 14px 28px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .card {
      margin-bottom: 14px;
      padding: 18px;
      background: #f4f4f4;
      border-radius: 8px;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      display: block;
      font-size: 16px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 60px;
      margin-top: 7px;
      padding: 8px 12px;
      border: 1px solid #c9c9c9;
      border-radius: 8px;
      background: #ffffff;
      color: #111111;
      font-size: 26px;
    }

    input:focus {
      border-color: #111111;
      outline: 3px solid #dddddd;
    }

    .result {
      margin: 14px 0 0;
      padding: 12px 14px;
      background: #ffffff;
      border-radius: 8px;
      font-size: 24px;
      font-weight: 800;
      line-height: 1.25;
    }

    button {
      display: block;
      margin: 14px auto 0;
      padding: 9px 16px;
      border: 1px solid #c9c9c9;
      border-radius: 8px;
      background: #f4f4f4;
      color: #111111;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <main>
    <h1>レンジ800W変換</h1>

    <section class="card" data-watt="500">
      <h2>500Wの時間</h2>
      <div class="inputs">
        <label>
          分
          <input class="minutes" type="number" inputmode="numeric" min="0" placeholder="0">
        </label>
        <label>
          秒
          <input class="seconds" type="number" inputmode="numeric" min="0" placeholder="0">
        </label>
      </div>
      <p class="result">800Wなら --</p>
    </section>

    <section class="card" data-watt="600">
      <h2>600Wの時間</h2>
      <div class="inputs">
        <label>
          分
          <input class="minutes" type="number" inputmode="numeric" min="0" placeholder="0">
        </label>
        <label>
          秒
          <input class="seconds" type="number" inputmode="numeric" min="0" placeholder="0">
        </label>
      </div>
      <p class="result">800Wなら --</p>
    </section>

    <button type="button" id="reset">リセット</button>
  </main>

  <script>
    function readNumber(input) {
      var value = Number(input.value);
      return Number.isFinite(value) && value > 0 ? value : 0;
    }

    function formatSeconds(totalSeconds) {
      if (totalSeconds < 60) {
        return totalSeconds + "秒";
      }

      var minutes = Math.floor(totalSeconds / 60);
      var seconds = totalSeconds % 60;
      return minutes + "分" + seconds + "秒";
    }

    function updateCard(card) {
      var watt = Number(card.dataset.watt);
      var minutesInput = card.querySelector(".minutes");
      var secondsInput = card.querySelector(".seconds");
      var result = card.querySelector(".result");
      var originalSeconds = readNumber(minutesInput) * 60 + readNumber(secondsInput);

      if (originalSeconds === 0) {
        result.textContent = "800Wなら --";
        return;
      }

      var convertedSeconds = Math.round(originalSeconds * watt / 800);
      result.textContent = "800Wなら " + formatSeconds(convertedSeconds);
    }

    var cards = document.querySelectorAll(".card");

    cards.forEach(function(card) {
      card.querySelectorAll("input").forEach(function(input) {
        input.addEventListener("input", function() {
          updateCard(card);
        });
      });
    });

    document.getElementById("reset").addEventListener("click", function() {
      cards.forEach(function(card) {
        card.querySelector(".minutes").value = "";
        card.querySelector(".seconds").value = "";
        updateCard(card);
      });
    });
  </script>
</body>
</html>
